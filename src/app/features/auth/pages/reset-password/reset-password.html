<div class="reset-password-container">
  <div class="reset-password-card">
    <h1>Restablecer contraseña</h1>

    <p class="description">
      Ingresa tu nueva contraseña para recuperar el acceso a tu cuenta de Fornicas.
    </p>

    <form (ngSubmit)="submit()" #resetForm="ngForm">
      <div class="form-group">
        <label for="newPassword">Nueva contraseña</label>
        <input
          id="newPassword"
          type="password"
          name="newPassword"
          [(ngModel)]="newPassword"
          required
          minlength="8"
          autocomplete="new-password"
          placeholder="Mínimo 8 caracteres"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          minlength="8"
          autocomplete="new-password"
          placeholder="Repite tu nueva contraseña"
        />
      </div>

      <!-- Usamos errorMessage() con paréntesis -->
      <p *ngIf="errorMessage()" class="message error" role="alert">
        {{ errorMessage() }}
      </p>

      <!-- Usamos successMessage() con paréntesis -->
      <p *ngIf="successMessage()" class="message success" role="status">
        {{ successMessage() }}
      </p>

      <!-- Usamos loading() con paréntesis -->
      <button
        type="submit"
        [disabled]="loading() || !resetForm.valid || !token"
      >
        {{ loading() ? 'Actualizando...' : 'Cambiar contraseña' }}
      </button>

      <button
        type="button"
        class="secondary-button"
        (click)="goToLogin()"
      >
        Volver al inicio de sesión
      </button>
    </form>
  </div>
</div>
