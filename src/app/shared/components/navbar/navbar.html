

<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
  @if (profilePhotoUrl()) {
    <img
      [src]="profilePhotoUrl"
      alt="Foto de perfil"
      class="profile-navbar-photo"
    />
  } @else {
    <img
      src="/images/fornicas-logo.png"
      alt="Logo de Fornicas"
      class="profile-navbar-photo"
    />
  }
</a>


    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#fornicasNavbar"
      aria-controls="fornicasNavbar"
      aria-expanded="false"
      aria-label="Abrir menú de navegación"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="fornicasNavbar">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item">
          <a class="nav-link" routerLink="/">Inicio</a>
        </li>

        @if (!isAuthenticated) {
          <li class="nav-item">
            <a class="btn btn-primary px-4" routerLink="/auth/login">
              Iniciar sesión
            </a>
          </li>
        } @else if (isWoman) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/panel">
              Mi panel
            </a>
          </li>
        <li class="nav-item">
          <a
            class="nav-link notification-link"
           routerLink="/panel/notificaciones"
            aria-label="Notificaciones"
            title="Notificaciones"
          >
            <span class="notification-bell" aria-hidden="true">🔔</span>
            <span>Notificaciones</span>


        @if (unreadCount() > 0) {
          <span class="badge rounded-pill bg-danger ms-1">
            {{ unreadCount() > 99 ? '99+' : unreadCount }}
          </span>
        }


          </a>
        </li>


          <li class="nav-item dropdown">
            <button
              class="btn btn-light dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Mi cuenta
            </button>

            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <span class="dropdown-item-text small text-muted">
                  {{ email }}
                </span>
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
              <a
          class="dropdown-item"
          [routerLink]="profile ()? ['/perfil', profile()!.id ] : '/panel'"
        >
          Mi perfil
        </a>
              </li>
              <li>
                <button
                  class="dropdown-item text-danger"
                  type="button"
                  (click)="logout()"
                >
                  Cerrar sesión
                </button>
              </li>
            </ul>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
