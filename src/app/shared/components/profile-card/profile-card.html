<article class="card profile-card h-100">
  <div class="profile-image-container">
    <img
      [src]="photoUrl"
      [alt]="'Foto de ' + name"
      class="card-img-top profile-image"
      loading="lazy"
    />
  </div>

  <div class="card-body d-flex flex-column">
    <h5 class="card-title mb-2">
      {{ name }}
      @if (age !== null) {
        <span class="profile-age">{{ age }}</span>
      }
    </h5>


@if (city) {
  <p class="profile-city mb-2">
    <span aria-hidden="true">📍</span> {{ city }}
  </p>
}

<p class="card-text profile-description">
  {{ description }}
</p>
<div class="profile-stats mb-3">
  <span title="Visitas al perfil">
    👁️ {{ totalViews }}
  </span>

  <span title="Calificación promedio">
    ⭐ {{ formattedRating }}
  </span>
</div>

<a
  class="btn btn-primary"
  [routerLink]="['/perfil', profileId]"
>
  Ver perfil
</a>


  </div>
</article>
