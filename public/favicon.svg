<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Degradado Morado Elegante -->
    <linearGradient id="fornicasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo redondeado estilo App Icon -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fornicasGrad)" />

  <!-- Letra F estilizada y moderna -->
  <path d="M 22 18 
           H 44 
           C 46 18, 46 23, 44 23 
           H 28 
           V 30 
           H 40 
           C 42 30, 42 35, 40 35 
           H 28 
           V 46 
           C 28 48, 23 48, 23 46 
           Z" fill="#ffffff" filter="url(#glow)" />
</svg>